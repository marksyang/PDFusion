<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>PDFusion</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-open" title="開啟 PDF (Cmd/Ctrl-O)">開啟…</button>
        <span id="doc-title" class="muted"></span>
        <span class="spacer"></span>
        <div class="op-group">
          <button data-tool="select" title="選取/刪除註解 (Delete 鍵)">選取</button>
          <button data-tool="highlight" title="螢光筆">螢光</button>
          <button data-tool="freetext" title="文字框">文字</button>
          <button data-tool="edit" title="編輯原文字（點選要改的文字）">改字</button>
          <button data-tool="rect" title="矩形">框線</button>
          <button data-tool="ellipse" title="圓形">圓形</button>
          <button data-tool="ink" title="自由筆畫">手寫</button>
          <span class="sep"></span>
          <button id="btn-bake" title="把註解烘焙進 PDF（原生註解）">烘焙註解</button>
        </div>
        <div class="op-group">
          <button id="btn-save" title="儲存目前工作檔 (Cmd+S)">儲存</button>
          <span class="sep"></span>
          <button id="btn-del-page" title="刪除目前頁">刪頁</button>
          <button id="btn-ins-blank" title="在目前頁前插入空白頁">＋空白</button>
          <button id="btn-ins-img" title="插入圖片為新頁">＋圖片</button>
          <button id="btn-ins-pdf" title="從其他 PDF 插入頁">＋PDF</button>
          <span class="sep"></span>
          <button id="btn-split-first" title="前半另存">拆前</button>
          <button id="btn-split-last" title="後半另存">拆後</button>
        </div>
        <div class="zoom-group">
          <button id="btn-zoom-out" title="縮小">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" title="放大">＋</button>
        </div>
        <span class="page-group">
          <button id="btn-prev" title="上一頁 (PageUp)">‹</button>
          <span id="page-label">–/–</span>
          <button id="btn-next" title="下一頁 (PageDown)">›</button>
        </span>
        <input id="search-input" type="search" placeholder="搜尋…" />
      </header>
      <div id="main-row">
        <aside id="thumbs"></aside>
        <main id="viewer"></main>
      </div>
      <footer id="statusbar">
        <span id="status"></span>
        <span id="hint" class="muted"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
